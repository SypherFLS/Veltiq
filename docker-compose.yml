name: veltiq

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-veltiq}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      POSTGRES_DB: ${DB_NAME:-veltiq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-veltiq} -d ${DB_NAME:-veltiq}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - veltiq

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/backend.config.yaml:/app/config.yaml:ro
    environment:
      CONFIG_PATH: /app/config.yaml
    expose:
      - "8080"
    networks:
      - veltiq

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_PUBLIC_API_BASE: ""
    expose:
      - "3000"
    networks:
      - veltiq

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - veltiq

volumes:
  postgres_data:

networks:
  veltiq:
    driver: bridge
